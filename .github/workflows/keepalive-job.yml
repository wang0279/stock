name: workflow_keep_alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep repository active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${{ github.repository }}/actions/workflows/check-mail.yml/disables || true
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/check-mail.yml/enable
